<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F2F42" />
    <meta name="description" content="VisionRaksha — AI-powered Explainable Diabetic Retinopathy Screening for Rural India. Early detection, Grad-CAM explainability, and doctor-in-the-loop validation." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VisionRaksha" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="icon" type="image/jpeg" href="/hero_illustration.jpg" />
    <link rel="manifest" href="/manifest.json" />

    <title>VisionRaksha — AI for Healthier Tomorrows</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        // In local development (localhost), unregister any active service worker & purge stale caches
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              registration.unregister();
              console.log('[SW] Unregistered development service worker');
            }
          });
          if ('caches' in window) {
            caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('[SW] Registered:', reg.scope))
              .catch(err => console.warn('[SW] Registration failed:', err));

            navigator.serviceWorker.addEventListener('message', (event) => {
              if (event.data?.type === 'SYNC_COMPLETE') {
                console.log('[SW] Synced screening:', event.data.screening_id);
              }
            });
          });
        }
      }
    </script>
  </body>
</html>
